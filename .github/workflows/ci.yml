name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.target }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
            target: linux-x64
          - os: ubuntu-24.04
            node: '24'
            target: linux-x64
          - os: ubuntu-24.04
            node: '26'
            target: linux-x64
          - os: ubuntu-24.04-arm
            node: '24'
            target: linux-arm64
          - os: macos-15
            node: '24'
            target: macos-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify native platform
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e 'const target = process.platform === "darwin" ? "macos-" + process.arch : process.platform + "-" + process.arch; if (target !== process.env.EXPECTED_TARGET) throw new Error("Unexpected Node platform: " + target);'
          python3 - <<'PY'
          import os, platform
          actual = {"Linux": {"x86_64": "linux-x64", "aarch64": "linux-arm64"},
                    "Darwin": {"arm64": "macos-arm64"}}.get(platform.system(), {}).get(platform.machine())
          if actual != os.environ["EXPECTED_TARGET"]:
              raise SystemExit(f"Unexpected Python platform: {actual!r}")
          PY
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - run: npm ci
      - run: npm run check:release
      - name: Verify clean source installation
        shell: bash
        run: |
          release_source="$RUNNER_TEMP/chatopus-source"
          npm run check:public -- --export="$release_source"
          cd "$release_source"
          node scripts/install.mjs --deploy-dir "$RUNNER_TEMP/chatopus-deployment"
          npm run smoke:defaults

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm audit --audit-level=high
