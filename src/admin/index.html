<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatopus · 运行控制台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="/"><span class="brand-mark">C<span>8</span></span><span>Chatopus<small>群聊智能体控制台</small></span></a>
  <div class="nav-label">工作空间</div>
  <nav aria-label="主要导航">
    <button data-view="overview" class="active"><span class="nav-icon">◈</span>运行概览</button>
    <button data-view="schedules"><span class="nav-icon">◷</span>定时任务</button>
    <button data-view="threads"><span class="nav-icon">▤</span>任务话题</button>
    <button data-view="messages"><span class="nav-icon">▱</span>群消息</button>
    <button data-view="decisions"><span class="nav-icon">⇄</span>路由决策</button>
    <button data-view="outbox"><span class="nav-icon">↗</span>回复投递</button>
    <button data-view="sessions"><span class="nav-icon">⌘</span>模型与工具轨迹</button>
    <button data-view="memory"><span class="nav-icon">◉</span>记忆</button>
    <div class="nav-divider"></div>
    <button data-view="business"><span class="nav-icon">▧</span>业务 · 提示词</button>
    <button data-view="config"><span class="nav-icon">⚙</span>模型 · 插件</button>
  </nav>
  <div class="side-bottom"><div class="local-dot"></div><div>本地运行<small>让答案自然融入群聊</small></div></div>
</aside>
<main>
  <header class="topbar"><div><div class="breadcrumb">工作空间 <span>/</span> <span id="breadcrumb-view">运行概览</span></div><h1 id="title">运行概览</h1><p id="subtitle">关注正在发生的事，随时追溯每一次回答。</p></div><div class="toolbar"><label class="sr-only" for="source">数据来源</label><select id="source" aria-label="数据来源"><option value="main">当前服务</option></select><button id="refresh" class="button icon-button" aria-label="刷新"><span>↻</span> 刷新</button></div></header>
  <div id="notice" class="notice" role="status"></div>
  <div id="filters" class="filter-bar" hidden><div class="filter-input"><span>⌕</span><input id="room" placeholder="按群作用域筛选，如 qq:账号:群号" aria-label="群作用域"></div><select id="status" aria-label="状态"><option value="">全部状态</option></select><button id="filter" class="button">应用筛选</button><span class="filter-hint">每页最多 100 条</span></div>
  <section id="content" aria-live="polite"></section>
  <footer><span id="updated">正在连接本地服务…</span><div id="pager" hidden><button id="prev" class="button">← 上一页</button><span id="page">1</span><button id="next" class="button">下一页 →</button></div><span id="refresh-note"><span class="tiny-dot"></span>概览每 5 秒自动更新</span></footer>
</main>
<dialog id="detail"><div class="dialog-head"><div><div class="section-kicker">完整处理链路</div><h2 id="detail-title">记录详情</h2></div><button id="close-detail" class="button">关闭</button></div><div id="detail-body"></div></dialog>
<script src="/app.js"></script>
</body></html>
